# Mirrors the CI gates (contract #6).
repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-merge-conflict
      - id: detect-private-key
  - repo: https://github.com/crate-ci/typos
    rev: v1
    hooks:
      - id: typos
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8
    hooks:
      - id: gitleaks
  - repo: local
    hooks:
      - id: fourmolu
        name: fourmolu
        entry: fourmolu -i
        language: system
        types: [haskell]
      - id: hlint
        name: hlint
        entry: hlint
        language: system
        types: [haskell]
