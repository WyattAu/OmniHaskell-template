name: Bug report
description: Something is broken in the template itself.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: Expected vs actual. Include the command you ran and its output.
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Environment
      options:
        - devcontainer (image-based)
        - devcontainer (nix)
        - nix + direnv (host)
        - manual toolchain (no nix)
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
    validations:
      required: true
