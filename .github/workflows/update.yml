# Template update channel (ADR-0001 phase 2, engineering-standards).
# In a DERIVED repo: weekly, `copier update` replays template changes and this
# workflow opens a PR with them. In the TEMPLATE repo itself there is no
# .copier-answers.yml, so the job exits clean - ship once, works everywhere.
#
# persist-credentials: true is deliberate here: copier update commits locally.
name: template-update

on:
  schedule:
    - cron: "0 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: true
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install copier
      - name: copier update (no-op in the template repo)
        run: |
          if [ ! -f .copier-answers.yml ]; then
            echo "template-update: no .copier-answers.yml - this is the template repo; nothing to update"
            exit 0
          fi
          git config user.name "omni-template-bot"
          git config user.email "wyatt_au@protonmail.com"
          copier update --defaults
      - name: open update PR
        uses: peter-evans/create-pull-request@22a9089034f40e5a961c8808d113e2c98fb63676 # v7
        with:
          branch: template-update
          delete-branch: true
          title: "chore: apply template updates (copier update)"
          commit-message: "chore: apply template updates (copier update)"
