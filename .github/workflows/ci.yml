# GHC matrix: 9.6 compat leg, 9.8 baseline (gated), 9.10 tip (experimental
# allowed-fail). Plus hlint, fourmolu/cabal-fmt check, weeder, docs build.
# Monthly bitrot cron catches Hackage/index drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # monthly bitrot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghc: "9.6.7"
            experimental: false
          - ghc: "9.8.4"
            experimental: false
          - ghc: "9.10.1"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ matrix.ghc }}-${{ hashFiles('cabal.project', '**/*.cabal') }}
          restore-keys: cabal-${{ matrix.ghc }}-
      - name: cabal update (mirrors 403 intermittently; retry before failing)
        run: |
          for attempt in 1 2 3; do
            if cabal update; then exit 0; fi
            echo "cabal update attempt ${attempt} failed; retrying in 15s" >&2
            sleep 15
          done
          echo "cabal update failed after 3 attempts" >&2
          exit 1
      - run: make test

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: "9.8.4"
      - name: cabal update (mirrors 403 intermittently; retry before failing)
        run: |
          for attempt in 1 2 3; do
            if cabal update; then exit 0; fi
            echo "cabal update attempt ${attempt} failed; retrying in 15s" >&2
            sleep 15
          done
          echo "cabal update failed after 3 attempts" >&2
          exit 1
      - name: fmt check
        run: |
          cabal install fourmolu cabal-fmt --overwrite-policy=always --installdir="$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/fmt-check.sh
      - name: hlint (pinned)
        run: |
          rm -rf /tmp/hlint && mkdir -p /tmp/hlint
          curl -sSfL https://github.com/ndmitchell/hlint/releases/download/v3.10/hlint-3.10-x86_64-linux.tar.gz | tar xz -C /tmp/hlint
          HLINT="$(find /tmp/hlint -type f -name hlint | head -1)"
          "$HLINT" .

  weeder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: "9.8.4"
      # Weeder analyzes the LIBRARY surface (hie files). Executables are
      # smoke-tested by build + run; their roots are not part of the gate.
      - name: cabal update (mirrors 403 intermittently; retry before failing)
        run: |
          for attempt in 1 2 3; do
            if cabal update; then exit 0; fi
            echo "cabal update attempt ${attempt} failed; retrying in 15s" >&2
            sleep 15
          done
          echo "cabal update failed after 3 attempts" >&2
          exit 1
      - run: cabal build lib:omni-core --disable-benchmarks
      - name: weeder (dead-code gate over hie files)
        run: |
          cabal install weeder --overwrite-policy=always --installdir="$HOME/.local/bin"
          "$HOME/.local/bin/weeder"

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - run: ./scripts/check-contract.sh

  # Loop 2: performance budget - blocking since it stayed green for a full
  # loop (LOOP.md graduation policy). Same scripts/ command a developer runs
  # locally; never a CI-only measurement path.
  perf:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: "9.8.4"
      - name: cabal update (mirrors 403 intermittently; retry before failing)
        run: |
          for attempt in 1 2 3; do
            if cabal update; then exit 0; fi
            echo "cabal update attempt ${attempt} failed; retrying in 15s" >&2
            sleep 15
          done
          echo "cabal update failed after 3 attempts" >&2
          exit 1
      - run: ./scripts/build.sh
      - run: make bench

  # Loop 3: determinism verification - blocking since it stayed green for a
  # full loop, and since measurement showed every toolchain in the estate is
  # byte-reproducible (ADR: determinism verification). Same scripts/ command a
  # developer runs locally.
  repro:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: "9.8.4"
      - run: cabal update
      - run: make repro

  # Phase 1 of copier adoption (ADR-0001, engineering-standards): copying this
  # template with default answers must reproduce the tracked content exactly.
  # Any drift is a template bug — the update channel depends on this invariant.
  scaffold:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: pip install copier
      - name: byte-identical scaffold check
        run: |
          git archive HEAD | mkdir -p "$RUNNER_TEMP/tracked" && tar -x -C "$RUNNER_TEMP/tracked" -f -
          copier copy --defaults "$RUNNER_TEMP/tracked" "$RUNNER_TEMP/sc"
          diff -r --exclude=.copier-answers.yml --exclude=.git --exclude=copier.yml \
            "$RUNNER_TEMP/sc" "$RUNNER_TEMP/tracked"
