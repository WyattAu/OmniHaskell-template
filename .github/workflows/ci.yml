# GHC matrix: 9.6 compat leg, 9.8 baseline (gated), 9.10 tip (experimental
# allowed-fail). Plus hlint, fourmolu/cabal-fmt check, weeder, docs build.
# Monthly bitrot cron catches Hackage/index drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # monthly bitrot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghc: "9.6.7"
            experimental: false
          - ghc: "9.8.4"
            experimental: false
          - ghc: "9.10.1"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
      - uses: actions/cache@v6
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ matrix.ghc }}-${{ hashFiles('cabal.project', '**/*.cabal') }}
          restore-keys: cabal-${{ matrix.ghc }}-
      - run: cabal update
      - run: make test

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8.4"
      - run: cabal update
      - name: fmt check
        run: |
          cabal install fourmolu cabal-fmt --overwrite-policy=always --installdir="$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/fmt-check.sh
      - name: hlint (pinned)
        run: |
          rm -rf /tmp/hlint && mkdir -p /tmp/hlint
          curl -sSfL https://github.com/ndmitchell/hlint/releases/download/v3.10/hlint-3.10-x86_64-linux.tar.gz | tar xz -C /tmp/hlint
          HLINT="$(find /tmp/hlint -type f -name hlint | head -1)"
          "$HLINT" .

  weeder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8.4"
      # Weeder analyzes the LIBRARY surface (hie files). Executables are
      # smoke-tested by build + run; their roots are not part of the gate.
      - run: cabal update && cabal build lib:omni-core
      - name: weeder (dead-code gate over hie files)
        run: |
          cabal install weeder --overwrite-policy=always --installdir="$HOME/.local/bin"
          "$HOME/.local/bin/weeder"

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: ./scripts/check-contract.sh

  # Loop 2: performance budget. Advisory for one loop, then graduates to a
  # blocking gate (LOOP.md graduation policy). Same scripts/ commands the
  # developer runs locally - never a CI-only measurement path.
  perf:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8.4"
      - run: cabal update
      - run: ./scripts/build.sh
      - run: make bench
