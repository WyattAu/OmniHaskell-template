# GHC matrix: 9.6 compat leg, 9.8 baseline (gated), 9.10 tip (experimental
# allowed-fail). Plus hlint, fourmolu/cabal-fmt check, weeder, docs build.
# Monthly bitrot cron catches Hackage/index drift.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 1 * *" # monthly bitrot

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - ghc: "9.6.7"
            experimental: false
          - ghc: "9.8.4"
            experimental: false
          - ghc: "9.10.1"
            experimental: true
    continue-on-error: ${{ matrix.experimental }}
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: ${{ matrix.ghc }}
          cabal-version: latest
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cabal/store
            dist-newstyle
          key: cabal-${{ matrix.ghc }}-${{ hashFiles('cabal.project', '**/*.cabal') }}
          restore-keys: cabal-${{ matrix.ghc }}-
      - run: cabal update
      - run: make test

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8.4"
      - run: cabal update
      - name: fmt check
        run: |
          cabal install fourmolu cabal-fmt --overwrite-policy=always --installdir="$HOME/.local/bin"
          export PATH="$HOME/.local/bin:$PATH"
          ./scripts/fmt-check.sh
      - name: hlint
        run: |
          curl -sSfL https://github.com/ndmitchell/hlint/releases/latest/download/hlint-x86_64-linux.tar.gz | tar xz
          ./hlint-x86_64-linux/hlint .

  weeder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: haskell-actions/setup@v2
        with:
          ghc-version: "9.8.4"
      - run: cabal update && cabal build all
      - uses: FreeMasen/weeder-action@v2
        with:
          ghc-version: "9.8.4"

  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: ./scripts/check-contract.sh
