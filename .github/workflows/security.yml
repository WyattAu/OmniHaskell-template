# Workflow security lint (zizmor) + dependency vulnerability scan (osv).
# Both are ADVISORY (continue-on-error) until the estate tunes thresholds
# (LOOP.md graduation policy).
name: security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 8 * * 5" # Fridays 08:00 UTC

permissions: read-all

jobs:
  zizmor:
    runs-on: ubuntu-latest
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: zizmor (GitHub Actions security lint)
        uses: zizmorcore/zizmor-action@cc914d7f3750a2d13d75c7f184a1060aa0e9d482 # v0.6.4
        with:
          advanced-security: false
