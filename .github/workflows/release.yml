# Tag → static-ish binaries for linux + macos, attested. Haskell has no
# central binary registry: tags + CHANGELOG are the release (ADR-0003).
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write
  attestations: write
  id-token: write

jobs:
  binaries:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            ghc: "9.8.4"
          - os: macos-latest
            ghc: "9.8.4"
    runs-on: ${{ matrix.os }}
    if: ${{ github.repository_owner == 'WyattAu' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: haskell-actions/setup@0f8e8c99d88aeb3fbfd523f1ef2c6f762d10d64d # v2
        with:
          ghc-version: ${{ matrix.ghc }}
      - run: cabal update && cabal build all --disable-benchmarks
      - name: stage
        run: |
          BIN=$(cabal list-bin omni-app)
          mkdir -p dist
          cp "$BIN" dist/omni-app
          strip dist/omni-app || true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: omni-app-${{ matrix.os }}
          path: dist/
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-path: dist/omni-app
