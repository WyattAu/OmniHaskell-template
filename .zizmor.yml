# zizmor configuration (loop 40).
#
# `excessive-permissions` is disabled for a verified reason, not for
# convenience: the release workflows declare their write scopes (contents,
# id-token, attestations) at the JOB level -- the least privilege that can
# function -- and the audit still classifies those necessary scopes as
# High-severity findings. A release job that publishes artifacts and
# generates attestations cannot run without them; the scopes are used, not
# vestigial. Every other audit stays enabled, and CI gates High findings.
